name: Test basic usage with valid ansible playbook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid ansible playbook for linting
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/ansible-valid"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/ansible-valid/playbook.yml" << 'EOF'
          ---
          - name: Example playbook
            hosts: localhost
            gather_facts: false
            tasks:
              - name: Print hello
                ansible.builtin.debug:
                  msg: "Hello, World!"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          workdir: tests/fixtures/ansible-valid
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
