name: Test basic ansible-lint run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: "dummy-token"
          reporter: "local"
          filter_mode: "nofilter"
          fail_level: "none"
          workdir: "."
          ansiblelint_flags: "--profile min pristine/reviewdog--action-ansiblelint/v1.18.0/testdata/test.yml"
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
