name: Test warning level reporting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          workdir: tests/fixtures/ansible-valid

      - name: Assert action completed with warning level
        run: |
          echo "Action completed with level=warning and fail_level=none"
          echo "PASS"
